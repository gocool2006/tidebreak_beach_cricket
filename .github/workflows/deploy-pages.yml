name: Deploy Tidebreak to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the game
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Stage only the playable game
        run: |
          mkdir -p _site/assets
          cp index.html styles.css app.js _site/
          cp assets/tidebreak-beach-ground.png _site/assets/

      - name: Upload the game site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Publish the game
        id: deployment
        uses: actions/deploy-pages@v4
